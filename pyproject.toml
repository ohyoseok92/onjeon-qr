[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onjeon-qr"
version = "0.1.0"
description = "Signed public QR issuance and verification prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "cryptography>=50,<51",
  "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
security = ["bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
