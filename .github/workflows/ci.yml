name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag in ohyoseok92/onjeon-qr'
        required: true
        type: string
      expected_sha256:
        description: 'ZIP SHA256 obtained from the approved independent release record'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix frontend
      - run: python -m pytest -q
      - run: python -m bandit -r src -q
      - run: python -m pip_audit -r requirements-dev.lock

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  image-artifact:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-image]')
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image from tested commit
        run: |
          docker build --pull --tag "onjeon-security-local:${GITHUB_SHA}" .
          mkdir -p "$RUNNER_TEMP/onjeon-image"
          docker image inspect --format '{{.Id}}' "onjeon-security-local:${GITHUB_SHA}" > "$RUNNER_TEMP/onjeon-image/image-id.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/onjeon-image/commit.txt"
          docker save "onjeon-security-local:${GITHUB_SHA}" | gzip -1 > "$RUNNER_TEMP/onjeon-image/image.tar.gz"
          cd "$RUNNER_TEMP/onjeon-image"
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onjeon-production-image-${{ github.sha }}
          path: ${{ runner.temp }}/onjeon-image/
          if-no-files-found: error
          retention-days: 7

  release-verification:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ONJEON_RELEASE_TAG != '')
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag || vars.ONJEON_RELEASE_TAG }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 || vars.ONJEON_RELEASE_ZIP_SHA256 }}
      EXPECTED_FINGERPRINT: ${{ vars.ONJEON_RELEASE_PUBLIC_KEY_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-runtime.lock
      - name: Check independently registered release expectations
        run: |
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,127}$ ]]
      - name: Download fixed repository release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/onjeon-release"
          gh release download "$RELEASE_TAG" --repo ohyoseok92/onjeon-qr --pattern OE-1_onjeon_source.zip --pattern RELEASE_SIGNATURE.json --dir "$RUNNER_TEMP/onjeon-release"
      - name: Verify signature, external digest and complete manifest
        run: |
          python scripts/release_gate.py "$RUNNER_TEMP/onjeon-release/OE-1_onjeon_source.zip" "$RUNNER_TEMP/onjeon-release/RELEASE_SIGNATURE.json" --expected-fingerprint "$EXPECTED_FINGERPRINT" --expected-sha256 "$EXPECTED_SHA256"
