# Install only after the named public certificate exists. nginx -t before reload.
limit_req_zone $binary_remote_addr zone=onjeon_requests:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=onjeon_connections:1m;
server {
    listen 80;
    server_name qr.ohs92.com;
    location /.well-known/acme-challenge/ { root /srv/onjeon-acme; }
    location / { return 308 https://qr.ohs92.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name qr.ohs92.com;
    ssl_certificate /etc/letsencrypt/live/qr.ohs92.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.ohs92.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 15s;
    limit_req zone=onjeon_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn onjeon_connections 20;
    limit_conn_status 429;
    access_log off;
    error_log /var/log/nginx/onjeon-error.log warn;
    location = /.well-known/onjeon-release.json {
        alias /var/www/onjeon-release/current.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_set_header Host qr.ohs92.com;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite caller-supplied forwarding data with this connection's peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
    }
}
